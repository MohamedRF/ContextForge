[workspace]
members = ["crates/contextforge-core", "crates/contextforge-index", "crates/contextforge-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"
authors = ["MohamedRF <soft-arch@ots.annauniv.edu>"]
repository = "https://github.com/MohamedRF/ContextForge"
homepage = "https://github.com/MohamedRF/ContextForge"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
