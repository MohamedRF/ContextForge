name: Prepare native packages

# Manual artifact preparation only; no tags, releases, package publishing or pushes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Native package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Validate frontend
        working-directory: apps/desktop
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run test
          npm run build
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test including MCP client
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --release --locked
      - name: Package and test extracted binary
        shell: bash
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          binary=target/release/contextforge
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="$binary.exe"; fi
          python3 scripts/package.py --binary "$binary" --target "$target" --output target/packages
      - name: Upload development artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contextforge-${{ runner.os }}-${{ runner.arch }}
          path: target/packages/*
          if-no-files-found: error
          retention-days: 14
